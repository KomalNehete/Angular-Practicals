<div class="portfolio-container">
 <header>
   <h1>{{ student.name }}</h1>
   <h3>{{ student.title }}</h3>
 </header>


 <section class="bio">
   <h2>About Me</h2>
   <p>{{ student.bio }}</p>
 </section>


 <section class="skills">
   <h2>Skills</h2>
   <ul>
     <li *ngFor="let skill of student.skills">
       {{ skill }}
     </li>
   </ul>
 </section>


 <section class="projects">
   <h2>Projects</h2>


   <div *ngFor="let project of student.projects" class="project-card">
     <h3>{{ project.name }}</h3>
     <p>{{ project.description }}</p>


     <a
       [href]="project.link"
       target="_blank"
       rel="noopener noreferrer"
     >
       View Project
     </a>
   </div>
 </section>


 <section class="contact">
   <h2>Contact</h2>


   <ul>
     <li>
       Email:
       <a [href]="'mailto:' + student.contact.email">
         {{ student.contact.email }}
       </a>
     </li>


     <li>
       Phone: {{ student.contact.phone }}
     </li>


     <li>
       LinkedIn:
       <a
         [href]="student.contact.linkedin"
         target="_blank"
         rel="noopener noreferrer"
       >
         Profile
       </a>
     </li>


     <li>
       GitHub:
       <a
         [href]="student.contact.github"
         target="_blank"
         rel="noopener noreferrer"
       >
         Repositories
       </a>
     </li>
   </ul>
 </section>
</div>
